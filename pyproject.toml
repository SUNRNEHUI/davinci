[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-cli"
version = "0.1.1"
description = "DAVINCI CLI and protected FLUT runtime for local photo grading."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "cryptography>=42.0",
]

[project.scripts]
davinci = "scripts.leica_cli:main"
leica-skill = "scripts.leica_cli:main"

[tool.setuptools.packages.find]
include = ["scripts*", "flut*"]

[tool.setuptools.package-data]
"flut.leica" = ["*.flut", "*.json", "*.b64"]
"flut.fuji" = ["*.flut", "*.json", "*.b64"]
